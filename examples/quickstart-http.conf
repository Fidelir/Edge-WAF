# Plain HTTP site for a first run: http://localhost/ -> app on 127.0.0.1:8080.
# Copy to conf.d/quickstart.conf. Use reverse-proxy.conf (TLS) for real domains.
# Bridge mode (docker-compose.bridge.yml): proxy_pass http://host.docker.internal:8080;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    include snippets/deny-probes.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include snippets/proxy.conf;
    }
}
