# Behind Cloudflare: take the client address from CF-Connecting-IP, only when the TCP peer is a Cloudflare edge.
# Copy to conf.d/00-realip.conf. Logs (client_ip), ModSecurity and monitor-ips.conf then see the visitor IP;
# the Cloudflare address stays in access.log as peer_ip. Use only one realip-*.conf at a time.

include /etc/nginx/realip/cloudflare.conf;
