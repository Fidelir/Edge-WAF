# JSON API. ModSecurity parses application/json bodies (rule 200001 in modsecurity/modsecurity.conf).
# Copy to conf.d/<domain>.conf. Requests without a User-Agent are not rejected here:
# many API clients (.NET HttpClient, OpenSSL-based tools) send none.
# deny-probes.conf rejects /graphql, /api/swagger and /api/openapi paths: leave it out for GraphQL APIs or
# published API docs (docs/tuning.md, "Probe guard").

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.example.com;
    include snippets/deny-probes.conf;

    ssl_certificate      /etc/nginx/ssl.d/api.example.com/fullchain.pem;
    ssl_certificate_key  /etc/nginx/ssl.d/api.example.com/privkey.pem;

    client_max_body_size  5m;

    error_page 400 = @json_400;
    error_page 403 = @json_403;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include snippets/proxy.conf;
    }

    location @json_400 {
        default_type application/json;
        return 400 '{"error":"bad_request","request_id":"$request_id"}\n';
    }

    location @json_403 {
        default_type application/json;
        return 403 '{"error":"forbidden","request_id":"$request_id"}\n';
    }
}
