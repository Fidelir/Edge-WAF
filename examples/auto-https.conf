# Automatic HTTPS: nginx requests and renews a Let's Encrypt certificate for the names in server_name
# (ngx_http_acme_module, HTTP-01 challenge). Copy to conf.d/<domain>.conf and set server_name and proxy_pass.
# Requirements: DNS for every name points to this host, port 80 is reachable from the internet, ./acme is mounted.
# Try "acme_certificate letsencrypt_staging;" first: its certificates are not trusted, but its rate limits are high.
# Upstream: host mode (default) -> http://127.0.0.1:PORT,
#           bridge mode         -> http://host.docker.internal:PORT or a container on a shared network

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    include snippets/deny-probes.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.example.com;
    include snippets/deny-probes.conf;

    acme_certificate       letsencrypt;
    ssl_certificate        $acme_certificate;
    ssl_certificate_key    $acme_certificate_key;
    ssl_certificate_cache  max=2;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include snippets/proxy.conf;
    }
}
