# Behind a load balancer or reverse proxy that sets X-Forwarded-For.
# Copy to conf.d/00-realip.conf and list only the proxy addresses you trust. Use only one realip-*.conf at a time.

set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;

real_ip_header     X-Forwarded-For;
real_ip_recursive  on;
