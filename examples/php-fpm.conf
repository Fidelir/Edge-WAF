# PHP application on PHP-FPM with a front controller (Laravel, Symfony, Slim, ...).
# Copy to conf.d/<domain>.conf. Mount the app's public directory at the path PHP-FPM uses,
# e.g. "- /var/www/app/public:/var/www/app/public:ro", so static files are served by nginx.
# FPM address: host mode (default) -> 127.0.0.1:9000, bridge mode -> php-fpm:9000 (container on a shared network).
# deny-probes.conf rejects direct *.php URLs; apps that need them (e.g. WordPress) should not include it.

server {
    listen 80;
    listen [::]:80;
    server_name php.example.com;
    include snippets/deny-probes.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name php.example.com;
    include snippets/deny-probes.conf;

    ssl_certificate      /etc/nginx/ssl.d/php.example.com/fullchain.pem;
    ssl_certificate_key  /etc/nginx/ssl.d/php.example.com/privkey.pem;

    root   /var/www/app/public;
    index  index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass   127.0.0.1:9000;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  HTTPS            on;
    }

    location ~ \.php$ {
        return 404;
    }
}
