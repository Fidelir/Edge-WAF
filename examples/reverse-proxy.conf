# Reverse proxy with TLS.
# Copy to conf.d/<domain>.conf, then set server_name, certificate paths and proxy_pass.
# Upstream: host mode (default) -> http://127.0.0.1:PORT,
#           bridge mode         -> http://host.docker.internal:PORT or a container on a shared network

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    include snippets/deny-probes.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com www.example.com;
    include snippets/deny-probes.conf;

    ssl_certificate      /etc/nginx/ssl.d/example.com/fullchain.pem;
    ssl_certificate_key  /etc/nginx/ssl.d/example.com/privkey.pem;

    # Per-site WAF overrides, see docs/tuning.md:
    # modsecurity_rules 'SecRuleEngine On';
    # modsecurity_rules 'SecRuleRemoveById 920350';

    location / {
        proxy_pass http://127.0.0.1:8080;
        include snippets/proxy.conf;
    }
}
