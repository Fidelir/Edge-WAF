# Static site served by the WAF container itself.
# Copy to conf.d/<domain>.conf and mount the files: add "- ./www:/srv/www:ro" to volumes in the compose file.

server {
    listen 80;
    listen [::]:80;
    server_name static.example.com;
    include snippets/deny-probes.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name static.example.com;
    include snippets/deny-probes.conf;
    # Browsers always send a User-Agent; uncomment to also reject requests without one:
    # include snippets/deny-empty-ua.conf;

    ssl_certificate      /etc/nginx/ssl.d/static.example.com/fullchain.pem;
    ssl_certificate_key  /etc/nginx/ssl.d/static.example.com/privkey.pem;

    root   /srv/www;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}
