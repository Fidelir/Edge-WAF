name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image for tests (no cache, current base image and Debian updates)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: edge-waf:release
          pull: true
          no-cache: true
          cache-to: type=gha,mode=max

      - name: Validate examples
        run: tests/examples.sh edge-waf:release

      - name: Smoke tests
        run: tests/smoke.sh edge-waf:release

      - name: Quick start (host network mode)
        run: tests/quickstart.sh edge-waf:release

      - name: Automatic HTTPS (Pebble)
        run: tests/acme.sh edge-waf:release

      - name: Trivy (CRITICAL/HIGH with available fixes)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: edge-waf:release
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { p = (index($0, "[" v "]") > 0); next } /^\[[^]]*\]: / { p = 0 } p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: push
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
