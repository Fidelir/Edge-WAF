load_module  modules/ngx_http_acme_module.so;

user  nginx;
pid   /run/nginx.pid;

worker_processes      auto;
worker_cpu_affinity   auto;
worker_rlimit_nofile  65535;
pcre_jit              on;

error_log  /var/log/nginx/error.log  warn;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    # === Logging ===
    map "$status:$uri" $waf_loggable {
        ~*^[23][0-9][0-9]:.*\.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?)$  0;
        default  1;
    }

    include     /etc/nginx/log-json.conf;
    access_log  /var/log/nginx/access.log  waf_json  if=$waf_loggable;

    # === Security ===
    include  /etc/nginx/probes.conf;

    modsecurity                 on;
    modsecurity_rules_file      /etc/nginx/modsec/main.conf;
    modsecurity_transaction_id  "$request_id";

    # === Basic settings ===
    http2          on;
    include        mime.types;
    default_type   application/octet-stream;
    server_tokens  off;

    sendfile     on;
    tcp_nopush   on;
    tcp_nodelay  on;

    server_names_hash_bucket_size  256;
    types_hash_max_size            4096;

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       '';
    }

    # === TLS ===
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  off;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve             X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;
    ssl_buffer_size            4k;

    # === Upstream response headers ===
    proxy_hide_header  Server;
    proxy_hide_header  X-Powered-By;
    proxy_hide_header  X-AspNet-Version;
    proxy_hide_header  X-AspNetMvc-Version;
    proxy_hide_header  X-Drupal-Cache;
    proxy_hide_header  X-Backend-Server;
    proxy_hide_header  X-Envoy-Upstream-Service-Time;

    # === Timeouts ===
    client_header_timeout      10s;
    client_body_timeout        30s;
    send_timeout               30s;
    keepalive_timeout          30s;
    reset_timedout_connection  on;

    # === Buffers ===
    client_body_buffer_size      128k;
    client_header_buffer_size    4k;
    large_client_header_buffers  4 16k;
    client_max_body_size         25m;

    # === Compression ===
    gzip             on;
    gzip_vary        on;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       application/atom+xml application/javascript application/json application/rss+xml application/vnd.ms-fontobject application/x-font-opentype application/x-font-truetype application/x-font-ttf application/x-javascript application/xhtml+xml application/xml font/eot font/opentype font/otf font/truetype image/svg+xml image/vnd.microsoft.icon image/x-icon image/x-win-bitmap text/css text/javascript text/plain text/xml;

    # === Includes ===
    include /etc/nginx/runtime/*.conf;
    include /etc/nginx/conf.d/*.conf;
}
