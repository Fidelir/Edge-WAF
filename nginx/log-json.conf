log_format waf_json escape=json '{'
        # Identity
        '"@timestamp":"$time_iso8601",'
        '"service":"edge-waf",'
        '"event":"http.access",'
        '"request_id":"$request_id",'

        # Client: client_ip is the real client (after realip, see examples/realip-*.conf), peer_ip is the TCP peer
        '"client_ip":"$remote_addr",'
        '"peer_ip":"$realip_remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"cf_connecting_ip":"$http_cf_connecting_ip",'
        '"cf_ipcountry":"$http_cf_ipcountry",'
        '"username":"$remote_user",'

        # Request
        '"scheme":"$scheme",'
        '"request_method":"$request_method",'
        '"uri":"$uri",'
        '"request_uri":"$request_uri",'
        '"query_string":"$query_string",'
        '"http_referer":"$http_referer",'
        '"useragent":"$http_user_agent",'
        '"request_length":"$request_length",'
        '"server_protocol":"$server_protocol",'
        '"origin":"$http_origin",'
        '"request_time":"$request_time",'
        '"deny_probe":"$waf_deny_probe",'
        '"deny_empty_ua":"$waf_deny_empty_ua",'

        # Response
        '"status":"$status",'
        '"content_length":"$content_length",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"bytes_sent":"$bytes_sent",'

        # Server
        '"hostname":"$host",'
        '"connection":"$connection",'
        '"connection_requests":"$connection_requests",'

        # Upstream
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_cache_status":"$upstream_cache_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"proxy_host":"$proxy_host",'

        # TLS
        '"ssl_client_serial":"$ssl_client_serial",'
        '"ssl_client_fingerprint":"$ssl_client_fingerprint",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"ssl_server_name":"$ssl_server_name"'
'}';
