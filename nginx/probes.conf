# Scanner probe detection. Flags only; enforcement is per server:
#   include snippets/deny-probes.conf;     -> $waf_deny_probe
#   include snippets/deny-empty-ua.conf;   -> $waf_deny_empty_ua

# Decoded and normalized path: percent-encoding (/.%65nv, /wp%2Dadmin) does not bypass it,
# query string is not inspected (no false positives on ?q=joomla, ?redirect=/index.php)
map $uri $waf_probe_path {
    default 0;

    # Dotfiles and dot-directories (.env, .git*, .svn, .hg, .aws, .ssh, .htaccess, .DS_Store), except /.well-known/
    ~*/\.(?!well-known(?:/|$)) 1;

    # PHP / webshells (info.php, phpinfo.php, app_dev.php/_profiler, *.php.bak, *.phtml, *.phar)
    ~*\.(?:php\d?|phtml|phar)(?:$|[/.]) 1;

    # Secrets, backups and config leaks
    ~*\.env(?:$|\.) 1;
    ~*\.(?:bak|old|orig|save|swp|sql|log|ini|dist|yaml|yml|conf)(?:$|[/.]) 1;
    ~*web\.config 1;
    ~*database\.(?:ya?ml|sqlite) 1;

    # WordPress / CMS
    ~*/wp-(?:admin|content|includes|login|json|config) 1;
    ~*wlwmanifest\.xml 1;
    ~*/xmlrpc 1;
    ~*acymailing 1;
    ~*/(?:joomla|drupal|typo3(?:conf)?)(?:/|$) 1;

    # Symfony / Laravel dev
    ~*/_(?:profiler|wdt)(?:/|$) 1;
    ~*phpinfo 1;

    # DB / admin tools
    ~*phpmyadmin 1;
    ~*/pma(?:/|$) 1;
    ~*adminer 1;

    # Spring / Java
    ~*/(?:actuator|jolokia)(?:/|$) 1;

    # Dev servers / LFI
    ~*/@fs/ 1;
    ~*/proc/self/ 1;

    # Shells / exploit kits
    ~*/shell(?:/|$) 1;
    ~*vendor/phpunit 1;
    ~*/cgi-bin/ 1;

    # Apache status, Exchange, routers
    ~*/server-(?:status|info)(?:/|$) 1;
    ~*/(?:autodiscover|owa|ecp)(?:/|$) 1;
    ~*/(?:hnap1|boaform)(?:/|$) 1;

    # GraphQL / API discovery
    ~*/graphql(?:/|$) 1;
    ~*/api/(?:graphql|swagger|openapi) 1;

    # Legacy ASP probes
    ~*\.aspx?(?:$|[/.]) 1;
}

# Raw request URI with query string: traversal and injection patterns, plain and percent-encoded
map $request_uri $waf_probe_raw {
    default 0;

    # ../  ..\  ..%2f  %2e%2e/  ..%5c
    ~*(?:\.|%2e)(?:\.|%2e)(?:/|\x5c|%2f|%5c) 1;
    ~*(?:/|%2f)proc(?:/|%2f)self(?:/|%2f) 1;
    ~*rest_route= 1;

    # UNION [ALL] SELECT separated by spaces, +, encoded bytes or /**/ comments
    ~*union(?:[\s+]|%[0-9a-f][0-9a-f]|/\*[^*]*\*/)+(?:all(?:[\s+]|%[0-9a-f][0-9a-f]|/\*[^*]*\*/)+)?select 1;
}

map $http_user_agent $waf_probe_ua {
    default 0;
    ~*OpenBash 1;
    ~*wp-admin/install 1;
    ~*masscan 1;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*gobuster 1;
    ~*feroxbuster 1;
    ~*dirsearch 1;
    ~*dirbuster 1;
    ~*ffuf 1;
    ~*wfuzz 1;
    ~*nmap 1;
    ~*zgrab 1;
    ~*nuclei 1;
    ~*wpscan 1;
    ~*whatweb 1;
    ~*acunetix 1;
    ~*netsparker 1;
    ~*openvas 1;
    ~*nessus 1;
    ~*l9explore 1;
    ~*l9tcpid 1;
}

map "$waf_probe_path$waf_probe_raw$waf_probe_ua" $waf_deny_probe {
    "000"   0;
    default 1;
}

# Empty User-Agent from an address not listed in monitor-ips.conf (matched against the real client IP after realip)
geo $waf_monitor_ip {
    default 0;
    include /etc/nginx/monitor-ips.conf;
}

map "$http_user_agent:$waf_monitor_ip" $waf_deny_empty_ua {
    default 0;
    ":0"    1;
}
